<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Order - Home Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
</head>
<body>

    <header class="hero" style="align-items: center; text-align: center; justify-content: center;">
        <div class="hero-logo" style="align-items: center; text-align: center; justify-content: center;">🍳</div>
        <h1><a href="/" style="color:white; text-decoration: none;">Home Kitchen</a></h1>
        <p class="hero-sub">Catering Service · Mrs. Mudassar Khan</p>
    </header>

    <main class="main-wrap">
        <div class="cart-page-header">
            <h1 class="section-title">Your Order</h1>
            <a href="/" class="continue-shopping-btn">← Continue Shopping</a>
        </div>

        <div id="cart-container">
            <!-- Cart items will be dynamically injected here -->
        </div>

        <div class="cart-summary" id="cart-summary">
            <!-- Summary will be injected here -->
        </div>
    </main>
    
    <div class="toast" id="toast"></div>

    <script src="js/cart.js"></script>
</body>
</html>
